line-length = 88
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (let formatter handle it)
    "E402", # module level import not at top (eventlet monkey patch must come first)
]

[lint.isort]
known-first-party = ["app", "models", "database"]
