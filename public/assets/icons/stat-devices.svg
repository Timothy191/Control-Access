<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="device-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#0051B3" />
    </linearGradient>
    <filter id="glow-device" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Plate -->
  <rect x="6" y="6" width="36" height="36" rx="10" fill="#1C1C1E" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <!-- Central Terminal Chassis -->
  <rect x="17" y="19" width="14" height="15" rx="3" fill="#121214" stroke="#007AFF" stroke-width="1.75" />
  <!-- Microchip Pins / Connectors -->
  <line x1="20" y1="34" x2="20" y2="37" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="34" x2="24" y2="37" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" />
  <line x1="28" y1="34" x2="28" y2="37" stroke="#007AFF" stroke-width="1.5" stroke-linecap="round" />
  <!-- Center Core Status LED -->
  <circle cx="24" cy="26.5" r="2.5" fill="#007AFF" filter="url(#glow-device)" />
  <!-- Antenna Mast & Broadcast Wave Arcs -->
  <path d="M 24 19 L 24 15" stroke="#007AFF" stroke-width="1.75" stroke-linecap="round" />
  <circle cx="24" cy="14" r="1.5" fill="#007AFF" />
  <path d="M 19 12 C 20.5 10.5 22.2 9.8 24 9.8 C 25.8 9.8 27.5 10.5 29 12" stroke="#64D2FF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <path d="M 16 9 C 18.2 7.2 21 6.2 24 6.2 C 27 6.2 29.8 7.2 32 9" stroke="#64D2FF" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
</svg>
