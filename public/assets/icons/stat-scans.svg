<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="scans-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#248A3D" />
    </linearGradient>
    <linearGradient id="laser-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#30D158" stop-opacity="0" />
      <stop offset="50%" stop-color="#30D158" stop-opacity="1" />
      <stop offset="100%" stop-color="#30D158" stop-opacity="0" />
    </linearGradient>
    <filter id="glow-scans" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Plate -->
  <rect x="6" y="6" width="36" height="36" rx="10" fill="#1C1C1E" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <!-- Corner Scan Brackets -->
  <path d="M 14 20 L 14 15 C 14 14.4 14.4 14 15 14 L 20 14" stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 34 20 L 34 15 C 34 14.4 33.6 14 33 14 L 28 14" stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 14 28 L 14 33 C 14 33.6 14.4 34 15 34 L 20 34" stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 34 28 L 34 33 C 34 33.6 33.6 34 33 34 L 28 34" stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Barcode / RFID Matrix Elements -->
  <rect x="18" y="19" width="2" height="10" rx="1" fill="#30D158" opacity="0.9" />
  <rect x="22" y="19" width="3" height="10" rx="1.2" fill="#30D158" opacity="0.95" />
  <rect x="27" y="19" width="1.5" height="10" rx="0.75" fill="#30D158" opacity="0.85" />
  <!-- Dynamic Laser Scan Line -->
  <line x1="12" y1="24" x2="36" y2="24" stroke="url(#laser-grad)" stroke-width="2.5" filter="url(#glow-scans)" />
</svg>
