<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A" />
      <stop offset="100%" stop-color="#D48800" />
    </linearGradient>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Plate -->
  <rect x="6" y="6" width="36" height="36" rx="10" fill="#1C1C1E" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <!-- Security Shield Perimeter -->
  <path d="M 24 13 L 33 16.5 C 33 24 29.5 30.5 24 33.5 C 18.5 30.5 15 24 15 16.5 L 24 13 Z" fill="rgba(255, 214, 10, 0.08)" stroke="#FFD60A" stroke-width="1.75" stroke-linejoin="round" />
  <!-- Inner Verification Checkmark -->
  <path d="M 20 23.5 L 23 26.5 L 28.5 20.5" stroke="#FFD60A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-amber)" />
  <!-- Pending Alert Dot -->
  <circle cx="34" cy="14" r="3" fill="#FF9F0A" stroke="#1C1C1E" stroke-width="1.5" />
</svg>
