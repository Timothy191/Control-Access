<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="muster-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF5AF2" />
      <stop offset="100%" stop-color="#5E5CE6" />
    </linearGradient>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Plate -->
  <rect x="6" y="6" width="36" height="36" rx="10" fill="#1C1C1E" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <!-- Outer Safety Boundary Radar Ring -->
  <circle cx="24" cy="24" r="14" stroke="#BF5AF2" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6" />
  <!-- Inner Safe Zone Circle -->
  <circle cx="24" cy="24" r="9" fill="rgba(191, 90, 242, 0.08)" stroke="#BF5AF2" stroke-width="1.5" />
  <!-- Center Muster Pin -->
  <circle cx="24" cy="24" r="2.5" fill="#BF5AF2" filter="url(#glow-purple)" />
  <!-- User Silhouette 1 (Center) -->
  <circle cx="24" cy="18" r="2" fill="#BF5AF2" />
  <path d="M 20.5 24 C 20.5 22 22 21.5 24 21.5 C 26 21.5 27.5 22 27.5 24" stroke="#BF5AF2" stroke-width="1.5" stroke-linecap="round" />
  <!-- User Silhouette 2 (Left) -->
  <circle cx="17" cy="25" r="1.5" fill="#BF5AF2" opacity="0.8" />
  <!-- User Silhouette 3 (Right) -->
  <circle cx="31" cy="25" r="1.5" fill="#BF5AF2" opacity="0.8" />
</svg>
