name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: OLLAMA_USE_CLOUD,OLLAMA_CLOUD_API_KEY
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin main
            source venv/bin/activate
            pip install -q -r requirements.txt

            # Rebuild AI model if Modelfile changed
            if [ -f Modelfile.mine ]; then
              ollama create mine-assistant-fast -f Modelfile.mine 2>/dev/null || \
              ollama create mine-assistant -f Modelfile.mine 2>/dev/null || true
            fi

            # Restart services
            pkill -f "python.*app.py" || true
            sleep 2

            # Start app with optional cloud AI
            nohup python3 app.py > server.log 2>&1 &
            sleep 3

            # Health check with retry
            for i in 1 2 3; do
              curl -sf http://localhost:8080/ > /dev/null && echo "Deploy successful" && break
              sleep 2
            done
            curl -sf http://localhost:8080/ > /dev/null || echo "Deploy failed - check server.log"