name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Pytest Suite & Linting
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev libsqlite3-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Syntax Verification & Compile Check
        run: |
          python -m py_compile app.py database.py models.py extensions.py utils.py services/*.py routes/*.py

      - name: Run Test Suite with Pytest & Coverage
        env:
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key-12345678901234567890123456789012
          HARDWARE_API_KEY: test-hardware-api-key-1234567890
          FIELD_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
          REDIS_URL: redis://localhost:6379/0
          VISITOR_PIN: 9999
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
