name: Next.js Industrial Spec CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: "file:./mine_management.db"
  TEST_BASE_URL: "http://127.0.0.1:8080"
  NEXTAUTH_SECRET: "ci-secret-32-character-long-random-string-for-auth"
  NEXTAUTH_URL: "http://127.0.0.1:8080"
  NEXT_PUBLIC_APP_URL: "http://127.0.0.1:8080"

jobs:
  lint-and-typecheck:
    name: Linting & TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Schema Validation & Client Generation
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate

      - name: TypeScript Compilation Check
        run: pnpm exec tsc --noEmit

      - name: ESLint Code Quality Check
        run: pnpm lint

  spec-and-stress-tests:
    name: Spec Verification & Challenger Stress Suites
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Prisma & SQLite Database
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate

      - name: Run E2E 4-Tier Spec Verification Suite
        run: pnpm test

      - name: Build Next.js Production Bundle
        run: pnpm build

      - name: Start Next.js Background Server for Live API Stress Testing
        run: |
          pnpm start -p 8080 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"
          
          # Wait for server /api/health to become available (up to 30 seconds)
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8080/api/health > /dev/null; then
              echo "Server is healthy and ready on port 8080!"
              break
            fi
            echo "Waiting for server to start ($i/30)..."
            sleep 1
          done

      - name: Run CSS Touch Targets & Glove Constraints Suite
        run: pnpm exec tsx tests/stress-css-touch-m2.ts

      - name: Run Empirical Challenger Gate Scan & Decoder Suite (M1)
        run: pnpm exec tsx tests/stress-challenger-m1.ts

      - name: Run API Regression Stress Harness
        run: pnpm exec tsx tests/stress_api_harness.ts

      - name: Run UI & Management Registers Challenger Suite (M2)
        run: pnpm exec tsx tests/stress_challenger_m2.ts

      - name: Run Challenger Gate 1 (Touch, Kiosk & Zero-Touch QR)
        run: pnpm exec tsx tests/stress_challenger_gate_1.ts

      - name: Run Challenger Gate 2 (Key Custody & Dual-Scan State Machine)
        run: pnpm exec tsx tests/stress_key_custody_challenger.ts

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-artifact
          path: |
            .next
            public
            package.json
            prisma
          retention-days: 7
