name: Industrial Spec & Safety Compliance Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: spec-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: "file:./mine_management.db"
  TEST_BASE_URL: "http://127.0.0.1:8080"
  NEXTAUTH_SECRET: "ci-secret-32-character-long-random-string-for-auth"
  NEXTAUTH_URL: "http://127.0.0.1:8080"
  NEXT_PUBLIC_APP_URL: "http://127.0.0.1:8080"

jobs:
  tier-spec-verification:
    name: 4-Tier Industrial Spec Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Generate & Sync DB Schema
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate

      - name: Tier 1 - Functional Feature Coverage
        run: pnpm exec tsx tests/e2e/runner.ts

  industrial-ergonomics-and-touch:
    name: CSS Touch Targets & Kiosk Ergonomics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Industrial CSS Glove Targets & Layout Constraints
        run: pnpm exec tsx tests/stress-css-touch-m2.ts

      - name: Verify Kiosk Safe Area & Optical HUD Pointer Trapping
        run: pnpm exec tsx tests/stress_challenger_gate_1.ts

  key-custody-and-compliance:
    name: Key Custody State Machine & Safety Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js v26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma Client Generation
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate

      - name: Build Next.js Application
        run: pnpm build

      - name: Start Next.js Background Service
        run: |
          pnpm start -p 8080 &
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8080/api/health > /dev/null; then
              echo "Server ready!"
              break
            fi
            sleep 1
          done

      - name: Key Custody & Sequential Dual-Scan Verification
        run: pnpm exec tsx tests/stress_key_custody_challenger.ts

      - name: Gate Scan Compliance & Medical/Induction Expiration Verification
        run: pnpm exec tsx tests/stress-challenger-m1.ts

      - name: API Integrity & Duplicate Entity Stress Suite
        run: pnpm exec tsx tests/stress_api_harness.ts
