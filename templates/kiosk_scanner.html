<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Gate Scanner — Arch-System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden;
            user-select: none;
        }

        /* ─── IDLE STATE ─── */
        #idle-screen {
            position: fixed; inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .scan-icon {
            font-size: 6rem;
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
        }

        .idle-title {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #e10600;
            margin-bottom: 0.5rem;
        }

        .idle-sub {
            font-size: 1.1rem;
            color: #555;
            letter-spacing: 2px;
        }

        .scan-beam {
            width: 280px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e10600, transparent);
            margin-top: 3rem;
            animation: beam 2s infinite;
        }

        #qr-capture {
            position: fixed;
            top: -999px;
            left: -999px;
            opacity: 0;
            width: 1px;
            height: 1px;
        }

        .typing-indicator {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #333;
            letter-spacing: 2px;
        }

        .buffer-display {
            position: fixed;
            bottom: 3.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #333;
            font-family: monospace;
            max-width: 80vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ─── TTS TOGGLE ─── */
        #tts-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 50;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 1.8rem;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        #tts-toggle:active { transform: scale(0.9); }
        #tts-toggle.off { opacity: 0.35; background: rgba(255,255,255,0.03); }
        #tts-toggle.off::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 2rem;
            background: #e10600;
            transform: rotate(45deg);
        }

        /* ─── RESULT OVERLAY ─── */
        #result-overlay {
            position: fixed; inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 100;
            transition: background-color 0.2s;
        }

        #result-overlay.approved { background: #006400; }
        #result-overlay.denied   { background: #8b0000; }
        #result-overlay.active   { display: flex; }

        .result-icon {
            font-size: 10rem;
            line-height: 1;
            margin-bottom: 1.5rem;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-status {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .result-name {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            opacity: 0.95;
        }

        .result-detail {
            font-size: 1.3rem;
            opacity: 0.7;
            margin-bottom: 1rem;
        }

        .result-reason {
            margin-top: 1rem;
            font-size: 1.4rem;
            font-weight: 600;
            background: rgba(0,0,0,0.25);
            padding: 0.75rem 2rem;
            border-radius: 10px;
        }

        .countdown-bar {
            position: fixed;
            bottom: 0; left: 0;
            height: 6px;
            background: rgba(255,255,255,0.4);
            transition: width linear;
        }

        /* ─── POPUP MODAL ─── */
        #popup-modal {
            position: fixed; inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            animation: fadeIn 0.2s;
        }
        #popup-modal.active { display: flex; }

        .popup-box {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 2.5rem 3rem;
            max-width: 85vw;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .popup-icon { font-size: 5rem; margin-bottom: 1rem; }
        .popup-title { font-size: 2.8rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 0.75rem; }
        .popup-title.approved { color: #00cc66; }
        .popup-title.denied { color: #e10600; }
        .popup-name { font-size: 1.6rem; font-weight: 600; margin-bottom: 0.5rem; opacity: 0.9; }
        .popup-detail { font-size: 1rem; opacity: 0.6; margin-bottom: 1rem; }
        .popup-reason { font-size: 1.2rem; font-weight: 600; color: #ff6b6b; margin-top: 0.5rem; }
        .popup-dismiss {
            margin-top: 1.5rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 0.75rem 2.5rem;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .popup-dismiss:active { background: rgba(255,255,255,0.2); }

        .result-footer {
            position: fixed;
            bottom: 1.5rem;
            font-size: 0.8rem;
            opacity: 0.4;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ─── SPINNER ─── */
        #processing {
            position: fixed; inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 90;
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: #aaa;
        }
        #processing.active { display: flex; }

        /* ─── DEVICE INFO ─── */
        #battery-indicator {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 50;
            font-size: 0.7rem;
            color: #333;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.08); }
        }

        @keyframes beam {
            0%   { opacity: 0; transform: scaleX(0); }
            50%  { opacity: 1; transform: scaleX(1); }
            100% { opacity: 0; transform: scaleX(0); }
        }

        @keyframes popIn {
            0%   { transform: scale(0.3); opacity: 0; }
            70%  { transform: scale(1.1); }
            100% { transform: scale(1);   opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>
</head>
<body>

<!-- ─── IDLE SCREEN ─── -->
<div id="idle-screen">
    <div class="scan-icon">◻</div>
    <div class="idle-title">Ready to Scan</div>
    <div class="idle-sub">Present QR Code to Scanner</div>
    <div class="scan-beam"></div>
</div>

<!-- ─── PROCESSING ─── -->
<div id="processing">⏳ &nbsp; PROCESSING...</div>

<!-- ─── FULLSCREEN OVERLAY ─── -->
<div id="result-overlay">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-status" id="result-status"></div>
    <div class="result-name"   id="result-name"></div>
    <div class="result-detail" id="result-detail"></div>
    <div class="result-reason" id="result-reason" style="display:none"></div>
    <div class="countdown-bar" id="countdown-bar"></div>
    <div class="result-footer">Arch-System Gate Access Control</div>
</div>

<!-- ─── POPUP MODAL ─── -->
<div id="popup-modal">
    <div class="popup-box">
        <div class="popup-icon" id="popup-icon"></div>
        <div class="popup-title" id="popup-title"></div>
        <div class="popup-name" id="popup-name"></div>
        <div class="popup-detail" id="popup-detail"></div>
        <div class="popup-reason" id="popup-reason" style="display:none"></div>
        <button class="popup-dismiss" id="popup-dismiss">OK</button>
    </div>
</div>

<!-- ─── TTS TOGGLE ─── -->
<button id="tts-toggle">🔊</button>
<div id="battery-indicator">● SCANNER MODE</div>

<!-- ─── Hidden input captures keyboard emulator ─── -->
<input id="qr-capture" type="text" autocomplete="off" autofocus>
<div class="buffer-display" id="buffer-display"></div>
<div class="typing-indicator">● KEYBOARD EMULATOR ACTIVE — SCANNER READY</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    const SERVER = window.location.origin;
    const RESET_MS  = 4000;
    const COMMIT_MS = 300;

    let buffer = '';
    let commitTimer = null;
    let busy = false;
    let ttsEnabled = true;

    const capture = document.getElementById('qr-capture');
    const ttsBtn = document.getElementById('tts-toggle');

    // ── SocketIO — listen for scan results from ALL sources ──
    let socket = null;
    try {
        socket = io({ transports: ['websocket', 'polling'], reconnection: true });
        socket.on('scan_result', (data) => {
            if (!busy && data && data.success !== undefined) {
                showResult(data);
            }
        });
    } catch(e) {
        console.warn('SocketIO unavailable, falling back to HTTP-only mode');
    }

    // ── TTS Setup ──
    ttsBtn.addEventListener('click', () => {
        ttsEnabled = !ttsEnabled;
        ttsBtn.classList.toggle('off', !ttsEnabled);
        ttsBtn.textContent = ttsEnabled ? '🔊' : '🔇';
    });

    function speak(text) {
        if (!ttsEnabled || !text || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 0.95;
        utter.pitch = 1.0;
        utter.volume = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Female'))
                     || voices.find(v => v.lang.startsWith('en'))
                     || null;
        if (enVoice) utter.voice = enVoice;
        window.speechSynthesis.speak(utter);
    }

    // Pre-load voices (async on Chrome)
    if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // ── Keep focus on hidden input ──
    function refocus() {
        if (!busy) capture.focus();
    }
    document.addEventListener('click', refocus);
    document.addEventListener('keydown', refocus);
    setInterval(refocus, 500);
    capture.focus();

    // ── Capture keyboard emulator ──
    capture.addEventListener('input', () => {
        if (busy) return;
        buffer = capture.value.trim();
        document.getElementById('buffer-display').textContent = buffer.length > 3 ? '●●●●●●●' : '';
        clearTimeout(commitTimer);
        if (buffer.length > 0) {
            commitTimer = setTimeout(() => submitScan(buffer), COMMIT_MS);
        }
    });

    capture.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && buffer.length > 0) {
            clearTimeout(commitTimer);
            submitScan(buffer);
        }
    });

    // ── Submit scan to server ──
    function submitScan(code) {
        if (busy) return;
        busy = true;
        buffer = '';
        capture.value = '';
        showProcessing(true);

        fetch(`${SERVER}/api/c66`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: code
        })
        .then(r => r.json())
        .then(data => {
            showProcessing(false);
            showResult(data);
        })
        .catch(() => {
            showProcessing(false);
            showResult({ success: false, name: 'SERVER ERROR', message: 'Could not reach server' });
        });
    }

    function showProcessing(show) {
        document.getElementById('processing').classList.toggle('active', show);
    }

    // ── Show result: quiet on approved, popup + TTS on denied ──
    function showResult(data) {
        const overlay  = document.getElementById('result-overlay');
        const idle     = document.getElementById('idle-screen');
        const modal    = document.getElementById('popup-modal');
        const approved = data.success === true || data.open_gate === true;
        const name     = data.name || data.entity_name || 'UNKNOWN';
        const message  = data.message || data.denial_reason || '';

        // ── APPROVED: silent, no popup, no sound ──
        if (approved) {
            busy = false;
            refocus();
            return;
        }

        // ── DENIED: popup + TTS ──
        const ttsText = data.tts_message || `Access denied. ${name}. ${message}`;

        // Fullscreen overlay
        overlay.className = 'active denied';
        document.getElementById('result-icon').textContent   = '✗';
        document.getElementById('result-status').textContent = 'DENIED';
        document.getElementById('result-name').textContent   = name;

        const detail = [
            (data.entity_type || 'SCAN').toUpperCase(),
            data.direction || ''
        ].filter(Boolean).join(' · ');
        document.getElementById('result-detail').textContent = detail;

        const reasonEl = document.getElementById('result-reason');
        if (message && message !== 'Access denied') {
            reasonEl.textContent = message;
            reasonEl.style.display = 'block';
        } else {
            reasonEl.style.display = 'none';
        }

        // Popup modal
        document.getElementById('popup-icon').textContent   = '✗';
        const titleEl = document.getElementById('popup-title');
        titleEl.textContent = 'DENIED';
        titleEl.className = 'popup-title denied';
        document.getElementById('popup-name').textContent   = name;
        document.getElementById('popup-detail').textContent = detail;

        const popupReason = document.getElementById('popup-reason');
        if (message && message !== 'Access denied') {
            popupReason.textContent = message;
            popupReason.style.display = 'block';
        } else {
            popupReason.style.display = 'none';
        }

        modal.classList.add('active');

        // Countdown bar
        const bar = document.getElementById('countdown-bar');
        bar.style.transition = 'none';
        bar.style.width = '100%';
        requestAnimationFrame(() => {
            bar.style.transition = `width ${RESET_MS}ms linear`;
            bar.style.width = '0%';
        });

        // Vibration on denied only
        if (navigator.vibrate) navigator.vibrate(600);

        // TTS voice on denied only
        speak(ttsText);

        idle.style.display = 'none';

        // Dismiss
        document.getElementById('popup-dismiss').onclick = () => dismissResult(overlay, idle, modal);
        overlay.onclick = () => dismissResult(overlay, idle, modal);

        // Auto-dismiss
        setTimeout(() => {
            if (modal.classList.contains('active')) {
                dismissResult(overlay, idle, modal);
            }
        }, RESET_MS);
    }

    function dismissResult(overlay, idle, modal) {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        modal.classList.remove('active');
        overlay.className = '';
        overlay.style.display = 'none';
        idle.style.display = 'flex';
        busy = false;
        refocus();
    }

    // ── PostMessage from InfoWedge plugin ──
    window.addEventListener('message', (e) => {
        const d = e.data;
        if (!d) return;
        let code = null;
        if (typeof d === 'string') code = d.trim();
        else if (d.barcodeData) code = d.barcodeData;
        else if (d.barcode) code = d.barcode;
        else if (d.data)    code = d.data;
        if (code && !busy) submitScan(code);
    });

    window.onScan = function(code) { if (!busy) submitScan(code); };

    // ── Bidirectional: if using keyboard emulator mode, submit directly ──
    // If SocketIO is receiving results from InfoWedge, the kiosk page acts as a display
    // If no SocketIO, the hidden input + HTTP POST handles everything
</script>
</body>
</html>
