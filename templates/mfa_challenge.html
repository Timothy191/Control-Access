{% extends "base.html" %}

{% block title %}MFA Challenge — Arch-System{% endblock %}

{% block content %}
<style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    .auth-page { height: 100vh; overflow: hidden; }
    .auth-page .app { display: block; height: 100%; }
    .auth-page .menu-toggle, .auth-page .sidebar, .auth-page .sidebar-trigger-zone, .auth-page .sidebar-overlay { display: none !important; }
    .auth-page .main-content { margin-left: 0 !important; padding-top: 0 !important; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .mfa-card {
        background: rgba(10,10,10,0.9);
        border: 1px solid var(--steel);
        border-radius: 24px;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .mfa-card h2 {
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 2px;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-group input {
        width: 100%;
        background: #000;
        border: 1px solid var(--steel);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        color: var(--text-primary);
        font-family: var(--font-mono);
        font-size: 1rem;
        text-align: center;
        letter-spacing: 0.2em;
    }
    .btn-login { width: 100%; background: var(--red-primary); border: none; border-radius: 8px; padding: 0.75rem; font-weight: 600; color: white; cursor: pointer; }
    .error-message { background: rgba(225,6,0,0.15); border-left: 3px solid var(--red-primary); padding: 0.75rem 1rem; margin-bottom: 1.5rem; border-radius: 8px; color: var(--red-primary); }
    .hint { color: var(--text-secondary); font-size: 0.8rem; margin-top: 1rem; text-align: center; }
</style>

<div class="mfa-card">
    <h2><i class="ti ti-shield-lock"></i> Two-Factor Auth</h2>
    {% if error %}
    <div class="error-message"><i class="ti ti-alert-triangle"></i> {{ error }}</div>
    {% endif %}
    <p style="text-align:center; color:var(--text-secondary); margin-bottom:1.5rem;">
        Enter the 6-digit code from your authenticator app for <strong>{{ username }}</strong>.
    </p>
    <form method="POST" action="{{ url_for('auth.mfa_challenge') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <input type="text" id="token" name="token" maxlength="20" inputmode="numeric" autocomplete="one-time-code" autofocus required placeholder="000000">
        </div>
        <button type="submit" class="btn-login"><i class="ti ti-login"></i> Verify</button>
    </form>
    <p class="hint">Backup codes can be used instead of a TOTP code.</p>
</div>
{% endblock %}
